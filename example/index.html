<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cantor Digitalis</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 600px;
        margin: 40px auto;
        padding: 0 20px;
        background: #1a1a1a;
        color: #eee;
      }
      h1 { margin-bottom: 20px; }
      .controls { display: flex; flex-direction: column; gap: 12px; }
      .slider-row {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .slider-row label {
        width: 120px;
        font-size: 14px;
      }
      .slider-row input[type="range"] {
        flex: 1;
      }
      .slider-row .value {
        width: 50px;
        text-align: right;
        font-family: monospace;
        font-size: 13px;
      }
      .checkbox-row {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 10px 0;
      }
      .features-section {
        margin-top: 20px;
        padding-top: 16px;
        border-top: 1px solid #333;
      }
      .features-section h3 {
        margin: 0 0 12px 0;
        font-size: 14px;
        color: #888;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }
      .features-section .checkbox-row {
        margin: 6px 0;
      }
      .features-section label {
        font-size: 13px;
        color: #aaa;
      }
      .buttons {
        display: flex;
        gap: 10px;
        margin-top: 20px;
      }
      button {
        padding: 10px 24px;
        font-size: 16px;
        cursor: pointer;
        border: none;
        border-radius: 4px;
      }
      #startBtn { background: #4a9; color: white; }
      #stopBtn { background: #a54; color: white; }
      button:disabled { opacity: 0.5; cursor: not-allowed; }
      #spectrum {
        width: 100%;
        height: 200px;
        background: #111;
        border-radius: 4px;
        margin-top: 20px;
      }
    </style>
  </head>
  <body>
    <h1>Cantor Digitalis</h1>
    <div id="app"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
